<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141414">
  <title>Spritz — filmes livres</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e50914'/%3E%3Ctext x='32' y='48' font-family='Impact,Arial' font-size='44' text-anchor='middle' fill='white'%3ES%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>:root{color-scheme:dark;--bg:#141414;--bg2:#181818;--red:#e50914;--muted:#a3a3a3;--g:clamp(16px,4vw,60px);--h:62px}
*{box-sizing:border-box}html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:#fff;font:400 15px/1.45 Inter,'Helvetica Neue',Arial,sans-serif;overflow-x:hidden;padding-bottom:104px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}a{color:inherit}[hidden]{display:none!important}
h1,h2,p{margin:0}[data-icon]{display:inline-grid;place-items:center;width:1em;height:1em}[data-icon] svg,.ico svg{width:100%;height:100%}.ico{display:inline-grid;width:1em;height:1em}
.topbar{position:fixed;inset:0 0 auto;height:var(--h);padding:0 var(--g);z-index:40;display:flex;align-items:center;gap:28px;background:linear-gradient(#000c,#0000);transition:background .3s}
.topbar.solid{background:#141414f2;backdrop-filter:blur(10px)}
.brand{font:400 34px/1 'Bebas Neue',Impact,sans-serif;letter-spacing:.05em;color:var(--red);text-decoration:none;text-shadow:0 2px 10px #0008}
.nav{display:none;gap:20px}.nav button{font-size:14px;color:#e5e5e5}.nav button.on{font-weight:700;color:#fff}.nav button:hover{color:#b3b3b3}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.search{display:flex;align-items:center;height:38px;padding:0 8px;border:1px solid transparent}.search.open{background:#000b;border-color:#fff}
.search-btn{font-size:25px}.search input{width:0;opacity:0;background:none;border:0;outline:0;color:#fff;font-size:14px;transition:width .25s,opacity .2s}
.search.open input{width:min(230px,52vw);opacity:1;margin-left:8px}.search input::-webkit-search-cancel-button{filter:invert(1)}
.profile{width:32px;height:32px;border-radius:6px;background:linear-gradient(135deg,var(--red),#6d0a10);font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:calc(var(--h) + 2px) var(--g) 12px}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 16px;border-radius:999px;background:#ffffff17;border:1px solid #ffffff26;font-size:14px;font-weight:600}.chip.on{background:#fff;color:#000;border-color:#fff}
.billboard{position:relative;overflow:hidden;isolation:isolate;margin:0 var(--g);border-radius:18px;border:1px solid #ffffff24}
.bb-bg{position:absolute;inset:-40px;z-index:-2;background:linear-gradient(135deg,#292929,#111) center/cover;filter:blur(30px) brightness(.55) saturate(1.2)}
.bb-shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,#141414f2,#14141426 60%)}
.bb-inner{display:flex;flex-direction:column;gap:16px;padding:14px 14px 16px;transition:opacity .25s}
.bb-poster{position:relative;width:100%;aspect-ratio:4/3;border-radius:12px;overflow:hidden;box-shadow:0 14px 40px #000a}.bb-poster img{width:100%;height:100%;object-fit:cover;display:block}
.bb-play{position:absolute;inset:0;display:grid;place-items:center;background:#0003}.bb-play>span{display:grid;place-items:center;width:62px;height:62px;border-radius:50%;border:2px solid #fff;background:#0007;font-size:26px;padding-left:3px}
.bb-text{text-align:center}.bb-kicker{font-size:11px;font-weight:700;letter-spacing:.2em;color:#ddd}.bb-kicker b{color:var(--red);font:400 20px 'Bebas Neue',Impact;letter-spacing:0;margin-right:4px}
.bb-text h1{font-size:clamp(26px,4.6vw,60px);font-weight:800;letter-spacing:-.03em;line-height:1.08;margin:6px 0 10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bb-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px;font-size:13px;font-weight:600;color:#d2d2d2}.bb-tags span+span:before{content:'•';margin-right:10px;color:#8a8a8a}
.bb-desc{display:none;color:#e5e5e5;line-height:1.5;margin:14px 0 20px;display:none}
.bb-actions{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:46px;padding:0 26px;border-radius:8px;font-weight:700;font-size:16px;transition:background .2s}.btn [data-icon]{font-size:22px}
.btn-play{background:#fff;color:#000}.btn-play:hover{background:#ffffffc4}.btn-gray{background:#6d6d6eb3}.btn-gray:hover{background:#6d6d6e66}
.rows{margin-top:24px;position:relative;z-index:2}.row{margin-bottom:26px}.row-head{position:relative;z-index:1;display:flex;align-items:center;gap:10px;padding:0 var(--g);margin-bottom:10px}
.row-head h2{font-size:clamp(17px,1.6vw,22px);font-weight:700}.row-more{display:flex;align-items:center;font-size:12px;font-weight:700;color:#54b9c5;opacity:0;transition:opacity .2s}.row-head:hover .row-more{opacity:1}
.row-wrap{position:relative}.track{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:22px var(--g);margin:-22px 0;scroll-behavior:smooth}.track::-webkit-scrollbar{display:none}
.arrow{display:none;position:absolute;top:0;bottom:0;width:48px;z-index:6;place-items:center;font-size:30px;background:#141414b3;opacity:0;transition:opacity .2s}.arrow.left{left:0}.arrow.right{right:0}
.card{position:relative;flex:0 0 auto;width:clamp(158px,17vw,265px);aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:linear-gradient(135deg,#3a1218,#1c1c1c);transition:transform .25s,box-shadow .25s}
.card img{width:100%;height:100%;object-fit:cover;display:block}.card-open{position:absolute;inset:0;width:100%}
.card-info{position:absolute;inset:auto 0 0;padding:30px 10px 8px;background:linear-gradient(0deg,#000e,#0000);pointer-events:none}
.card-title{font-size:13px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.card-sub{font-size:11px;color:#bbb}
.round{position:absolute;top:8px;right:8px;z-index:2;width:30px;height:30px;border-radius:50%;border:2px solid #fff9;background:#141414b8;display:grid;place-items:center;font-size:15px}.round.on{background:#fff;color:#000;border-color:#fff}
.sk{background:linear-gradient(90deg,#222 25%,#2e2e2e 40%,#222 60%);background-size:400% 100%;animation:sh 1.4s infinite}@keyframes sh{to{background-position:-100% 0}}
.msg{color:var(--muted);padding:24px 0;font-size:14px}.msg button{margin-left:10px;color:#fff;text-decoration:underline}
.grid-view{padding:6px var(--g) 30px}.grid-head{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}.grid-head h1{font-size:24px;font-weight:800}#grid-count{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 8px}.grid .card{width:auto}.grid-foot{display:flex;justify-content:center;margin-top:26px}
.foot{padding:26px var(--g) 30px;border-top:1px solid #262626;color:#8c8c8c;font-size:12px}.foot p{max-width:720px}
.bottom-nav{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:45;display:flex;width:min(92vw,420px);padding:6px;border-radius:999px;background:#202020eb;backdrop-filter:blur(16px);border:1px solid #ffffff1a;box-shadow:0 10px 30px #000a}
.bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px;border-radius:999px;font-size:11px;color:#bdbdbd}.bottom-nav [data-icon]{font-size:24px}.bottom-nav .on{background:#ffffff1f;color:#fff}
.modal{position:fixed;inset:0;z-index:60;display:none;overflow:auto;padding:3vh 12px}.modal.open{display:flex}.modal-bd{position:fixed;inset:0;background:#000b;backdrop-filter:blur(6px)}
.panel{position:relative;margin:auto;width:min(920px,100%);background:var(--bg2);border-radius:12px;overflow:hidden;box-shadow:0 30px 100px #000}.player{aspect-ratio:16/9;background:#000}.player iframe{width:100%;height:100%;border:0}
.m-close{position:absolute;top:12px;right:12px;z-index:3;width:36px;height:36px;border-radius:50%;background:#181818e6;font-size:20px}
.m-body{display:flex;flex-direction:column;gap:18px;padding:20px 20px 26px}.m-body h2{font-size:24px;font-weight:800;letter-spacing:-.02em}.m-body .bb-tags{justify-content:flex-start;margin:8px 0 12px}.m-body p{color:#cfcfcf;font-size:14px}
.m-side{display:flex;flex-direction:column;gap:12px;align-items:flex-start}.m-side a{font-size:13px;color:#b3b3b3}
.toast{position:fixed;z-index:70;left:50%;bottom:104px;transform:translate(-50%,16px);background:#fff;color:#111;font-weight:700;font-size:13px;padding:11px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(hover:hover){.card:hover{transform:scale(1.1);z-index:5;box-shadow:0 14px 34px #000c}.round{opacity:0;transition:opacity .2s}.card:hover .round,.round.on{opacity:1}.row-wrap:hover .arrow{opacity:1}}
@media(min-width:900px){
 body{padding-bottom:0}.chips,.bottom-nav{display:none}.nav{display:flex}.arrow{display:grid}
 .billboard{margin:0;border:0;border-radius:0;min-height:clamp(520px,50vw,700px);display:flex;align-items:center}.bb-shade{background:linear-gradient(0deg,#141414,#1414140 38%),linear-gradient(90deg,#141414e6,#14141440 70%)}
 .bb-inner{width:100%;flex-direction:row-reverse;align-items:center;justify-content:space-between;gap:48px;padding:calc(var(--h) + 36px) var(--g) 110px}
 .bb-poster{width:min(46%,640px);aspect-ratio:16/10;flex:none}.bb-text{text-align:left;max-width:520px}.bb-tags{justify-content:flex-start;font-size:14px}.bb-desc{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
 .bb-actions{flex-direction:row}.rows{margin-top:-76px}.grid-view{padding-top:calc(var(--h) + 30px)}.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:34px 8px}
 .m-body{flex-direction:row;justify-content:space-between;gap:36px;padding:24px 32px 32px}.m-body h2{font-size:30px}.toast{bottom:28px}
}
@media(max-width:899px){.topbar.searching .brand{display:none}.topbar.searching .nav-right{flex:1}.topbar.searching .search{flex:1}.topbar.searching .search input{width:100%}.profile{display:none}.search.open+.profile{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
  <header class="topbar" id="topbar">
    <a class="brand" href="#" id="brand" aria-label="Spritz — início">SPRITZ</a>
    <nav class="nav" id="nav" aria-label="Navegação principal"></nav>
    <div class="nav-right">
      <div class="search" id="search-box"><button class="search-btn" id="search-btn" aria-label="Buscar" data-icon="search"></button><input id="search" type="search" placeholder="Títulos, ex.: Nosferatu" autocomplete="off"></div>
      <button class="profile" aria-label="Perfil">J</button>
    </div>
  </header>
  <div class="chips" id="chips"></div>
  <main>
    <section class="billboard" id="billboard" aria-label="Destaque">
      <div class="bb-bg" id="bb-bg"></div><div class="bb-shade"></div>
      <div class="bb-inner">
        <button class="bb-poster" id="bb-poster" aria-label="Assistir destaque"><img id="bb-img" src="" alt=""><span class="bb-play"><span data-icon="play"></span></span></button>
        <div class="bb-text">
          <div class="bb-kicker"><b>S</b> FILME LIVRE</div>
          <h1 id="bb-title">Spritz</h1>
          <div class="bb-tags" id="bb-tags"></div>
          <p class="bb-desc" id="bb-desc">Clássicos e obras independentes com licença livre, direto do acervo do Internet Archive.</p>
          <div class="bb-actions"><button class="btn btn-play" id="bb-play"><span data-icon="play"></span>Assistir</button><button class="btn btn-gray" id="bb-list"><span data-icon="plus"></span><span>Minha lista</span></button></div>
        </div>
      </div>
    </section>
    <div class="rows" id="home"></div>
    <section class="grid-view" id="grid-view" hidden>
      <div class="grid-head"><h1 id="grid-title"></h1><span id="grid-count"></span></div>
      <div class="grid" id="grid"></div>
      <div class="grid-foot"><button class="btn btn-gray" id="more" hidden>Carregar mais</button></div>
    </section>
  </main>
  <footer class="foot"><p>Os filmes são servidos pelo <a href="https://archive.org/" target="_blank" rel="noopener">Internet Archive</a>. A disponibilidade e os termos de cada obra pertencem ao item original; confira a licença antes de reutilizar.</p></footer>
  <nav class="bottom-nav" id="bottom-nav" aria-label="Atalhos">
    <button data-key="home"><span data-icon="home"></span>Início</button>
    <button data-key="search"><span data-icon="search"></span>Buscar</button>
    <button data-key="list"><span data-icon="list"></span>Minha lista</button>
  </nav>
  <div class="modal" id="modal" aria-hidden="true"><div class="modal-bd"></div>
    <section class="panel" role="dialog" aria-modal="true" aria-labelledby="m-title">
      <button class="m-close" id="m-close" aria-label="Fechar" data-icon="close"></button>
      <div class="player" id="player"></div>
      <div class="m-body"><div><h2 id="m-title"></h2><div class="bb-tags" id="m-tags"></div><p id="m-desc"></p></div>
        <div class="m-side"><button class="btn btn-gray" id="m-save"></button><a id="m-link" target="_blank" rel="noopener">Ver no Archive.org ↗</a></div></div>
    </section></div>
  <div class="toast" id="toast" role="status"></div>
<script>(() => {
const API = 'https://archive.org/advancedsearch.php';
const LICENSE = '(' + ['publicdomain/mark/1.0/', 'publicdomain/zero/1.0/', 'licenses/by/4.0/', 'licenses/by-sa/4.0/']
  .flatMap(p => ['http', 'https'].map(s => 'licenseurl:"' + s + '://creativecommons.org/' + p + '"')).join(' OR ') + ')';
const CATS = [
  { id: 'anima', label: 'Animação', row: 'Animações para maratonar', q: 'subject:(animation OR cartoon OR cartoons)' },
  { id: 'comedy', label: 'Comédia', row: 'Para rir à vontade', q: 'subject:(comedy)' },
  { id: 'drama', label: 'Drama', row: 'Dramas', q: 'subject:(drama)' },
  { id: 'horror', label: 'Terror', row: 'Terror clássico', q: 'subject:(horror)' },
  { id: 'scifi', label: 'Ficção científica', row: 'Ficção científica', q: 'subject:("science fiction" OR "sci-fi")' },
  { id: 'documentary', label: 'Documentários', row: 'Documentários', q: 'subject:(documentary)' },
  { id: 'classics', label: 'Clássicos', row: 'Clássicos do cinema', q: 'year:[1900 TO 1959]' }
];
const I = {
  play: '<path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z" fill="currentColor" stroke="none"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', check: '<path d="M5 12.5l4.5 4.5L19 7"/>', close: '<path d="M6 6l12 12M18 6L6 18"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>', left: '<path d="M15 5l-7 7 7 7"/>', right: '<path d="M9 5l7 7-7 7"/>',
  home: '<path d="M4 10.5L12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/>',
  list: '<path d="M6 4h12a1 1 0 0 1 1 1v15l-7-4-7 4V5a1 1 0 0 1 1-1z"/>'
};
const svg = n => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">' + I[n] + '</svg>';
const $ = s => document.querySelector(s);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };
const icon = n => { const s = el('span', 'ico'); s.innerHTML = svg(n); return s; };
const hydrate = () => document.querySelectorAll('[data-icon]').forEach(n => n.innerHTML = svg(n.dataset.icon));

const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let saved = store.get('spritz-list') || store.get('nevoa-open-list') || [];
const isSaved = it => saved.some(x => x.identifier === it.identifier);

const clean = h => (Array.isArray(h) ? h.join(' ') : String(h || '')).replace(/<[^>]*>/g, ' ').replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim();
const titleOf = it => clean(Array.isArray(it.title) ? it.title[0] : it.title) || it.identifier || 'Filme sem título';
const cover = it => 'https://archive.org/services/img/' + encodeURIComponent(it.identifier);
const license = u => { const l = String(u || '').toLowerCase(); return l.includes('publicdomain') || l.includes('zero') ? 'Domínio público' : l.includes('by-sa') ? 'CC BY-SA' : l.includes('by/') ? 'CC BY' : 'Creative Commons'; };
const genres = it => { const s = it.subject, a = Array.isArray(s) ? s : s ? String(s).split(/[;,]/) : [];
  return [...new Set(a.map(x => String(x).trim()).filter(x => x && x.length < 22).map(x => x[0].toUpperCase() + x.slice(1).toLowerCase()))].slice(0, 2); };
const subline = it => [it.year, license(it.licenseurl)].filter(Boolean).join(' · ');
const slim = it => ({ identifier: it.identifier, title: titleOf(it), year: it.year, description: clean(it.description).slice(0, 500), licenseurl: it.licenseurl, subject: genres(it) });

async function fetchItems({ cat = '', text = '', page = 1, rows = 30 } = {}) {
  let q = 'mediatype:movies AND ' + LICENSE;
  if (cat) q += ' AND (' + cat + ')';
  if (text) q += ' AND title:"' + text.replace(/["\\]/g, '\\$&') + '"';
  const p = new URLSearchParams({ q, rows, page, output: 'json' });
  ['identifier', 'title', 'year', 'description', 'licenseurl', 'subject'].forEach(f => p.append('fl[]', f));
  p.append('sort[]', 'downloads desc');
  const r = await fetch(API + '?' + p);
  if (!r.ok) throw new Error(r.status);
  const b = (await r.json()).response || {};
  return { docs: b.docs || [], total: +b.numFound || 0 };
}

/* ---------- cards & rows ---------- */
function createCard(it) {
  const card = el('article', 'card');
  const img = new Image(); img.alt = ''; img.loading = 'lazy'; img.src = cover(it); img.onerror = () => img.remove();
  const open = el('button', 'card-open'); open.type = 'button'; open.setAttribute('aria-label', 'Abrir ' + titleOf(it)); open.onclick = () => openPlayer(it);
  const info = el('div', 'card-info'); info.append(el('div', 'card-title', titleOf(it)), el('div', 'card-sub', subline(it)));
  const save = el('button', 'round'); save.type = 'button'; save.dataset.id = it.identifier; save.onclick = () => toggleSaved(it);
  card.append(img, open, info, save); paintSave(save); return card;
}
function paintSave(b) {
  const on = saved.some(x => x.identifier === b.dataset.id);
  b.classList.toggle('on', on); b.replaceChildren(icon(on ? 'check' : 'plus')); b.setAttribute('aria-label', on ? 'Remover da minha lista' : 'Adicionar à minha lista');
}
function makeRow(title, onMore) {
  const section = el('section', 'row'), head = el('div', 'row-head'), wrap = el('div', 'row-wrap'), track = el('div', 'track');
  head.append(el('h2', '', title));
  if (onMore) { const m = el('button', 'row-more'); m.append('Ver tudo', icon('right')); m.onclick = onMore; head.append(m); }
  [['left', -1], ['right', 1]].forEach(([d, s]) => { const a = el('button', 'arrow ' + d); a.setAttribute('aria-label', d === 'left' ? 'Anterior' : 'Próximo'); a.append(icon(d)); a.onclick = () => track.scrollBy({ left: s * track.clientWidth * .85 }); wrap.append(a); });
  wrap.prepend(track); section.append(head, wrap); return { section, track };
}
function skeleton(track) { track.replaceChildren(...Array.from({ length: 8 }, () => el('div', 'card sk'))); }
function loadRow(row, job) {
  const run = () => { skeleton(row.track);
    job().then(docs => { if (!docs.length) row.section.hidden = true; else row.track.replaceChildren(...docs.map(createCard)); })
      .catch(() => { const m = el('div', 'msg', 'Não foi possível carregar agora.'), b = el('button', '', 'Tentar de novo'); b.onclick = run; m.append(b); row.track.replaceChildren(m); }); };
  run();
}

/* ---------- home ---------- */
const homeEl = $('#home'), gridView = $('#grid-view'), gridEl = $('#grid'), bill = $('#billboard'), moreBtn = $('#more');
let rowList, feat = null;
function buildHome() {
  homeEl.replaceChildren();
  rowList = makeRow('Minha lista', () => go('list')); homeEl.append(rowList.section); renderRowList();
  const hot = makeRow('Em alta agora'); homeEl.append(hot.section);
  loadRow(hot, async () => { const { docs } = await fetchItems({ rows: 36 }); if (docs.length && !feat) setFeatured(docs.find(d => clean(d.description)) || docs[0]); return docs; });
  CATS.forEach(c => { const r = makeRow(c.row, () => go(c.id)); homeEl.append(r.section); loadRow(r, async () => (await fetchItems({ cat: c.q, rows: 20 })).docs); });
}
function renderRowList() { rowList.section.hidden = !saved.length; rowList.track.replaceChildren(...saved.map(createCard)); }
function setFeatured(it) {
  feat = it;
  $('#bb-title').textContent = titleOf(it);
  $('#bb-desc').textContent = clean(it.description).slice(0, 220) || 'Um dos filmes mais vistos do acervo com licença livre.';
  const tags = $('#bb-tags'); tags.replaceChildren(...[it.year, license(it.licenseurl), ...genres(it)].filter(Boolean).map(t => el('span', '', t)));
  $('#bb-img').src = cover(it); $('#bb-bg').style.backgroundImage = 'url("' + cover(it) + '")';
  $('#bb-play').onclick = $('#bb-poster').onclick = () => openPlayer(it);
  $('#bb-list').onclick = () => toggleSaved(it); paintBillList();
}
function paintBillList() {
  const on = feat && isSaved(feat), b = $('#bb-list');
  b.replaceChildren(icon(on ? 'check' : 'plus'), el('span', '', 'Minha lista'));
}

/* ---------- views ---------- */
const st = { view: 'home', cat: null, text: '', page: 1, total: 0, items: [], token: 0 };
const searchBox = $('#search-box'), searchEl = $('#search'), topbar = $('#topbar');
const NAV = [{ k: 'home', l: 'Início' }, ...CATS.map(c => ({ k: c.id, l: c.label })), { k: 'list', l: 'Minha lista' }];
function buildNav() {
  [['#nav', ''], ['#chips', 'chip']].forEach(([sel, cls]) => { const box = $(sel); NAV.forEach(n => { const b = el('button', cls, n.l); b.type = 'button'; b.dataset.k = n.k; b.onclick = () => go(n.k); box.append(b); }); });
  document.querySelectorAll('#bottom-nav button').forEach(b => b.onclick = () => b.dataset.key === 'search' ? toggleSearch(true) : go(b.dataset.key));
}
function go(key) { searchEl.value = ''; toggleSearch(false); show(key === 'home' ? 'home' : key === 'list' ? 'list' : 'cat', { cat: key }); }
function show(view, o = {}) {
  Object.assign(st, { view, cat: o.cat || null, text: o.text || '' });
  const home = view === 'home'; bill.hidden = homeEl.hidden = !home; gridView.hidden = home;
  if (view === 'list') renderGrid(saved, saved.length, true); else if (!home) loadGrid(true);
  const key = view === 'cat' ? st.cat : view === 'search' ? null : view;
  document.querySelectorAll('[data-k]').forEach(b => b.classList.toggle('on', b.dataset.k === key));
  document.querySelectorAll('#bottom-nav button').forEach(b => b.classList.toggle('on', b.dataset.key === (view === 'search' ? 'search' : key === 'home' || key === 'list' ? key : '')));
  scrollTo({ top: 0, behavior: 'instant' });
}
async function loadGrid(reset) {
  const t = ++st.token; if (reset) { st.page = 1; st.items = []; gridEl.replaceChildren(...Array.from({ length: 12 }, () => el('div', 'card sk'))); moreBtn.hidden = true; $('#grid-count').textContent = ''; setTitle(); }
  else { moreBtn.disabled = true; moreBtn.textContent = 'Carregando…'; }
  try {
    const c = CATS.find(x => x.id === st.cat);
    const { docs, total } = await fetchItems({ cat: c ? c.q : '', text: st.text, page: st.page, rows: 36 });
    if (t !== st.token) return;
    st.items = reset ? docs : st.items.concat(docs); renderGrid(st.items, total, false, docs.length === 0);
  } catch { if (t !== st.token) return; const m = el('div', 'msg', 'Não foi possível conectar ao Internet Archive agora.'), b = el('button', '', 'Tentar de novo'); b.onclick = () => loadGrid(true); m.append(b); gridEl.replaceChildren(m); }
}
function setTitle() { const c = CATS.find(x => x.id === st.cat); $('#grid-title').textContent = st.view === 'list' ? 'Minha lista' : st.view === 'search' ? 'Resultados para “' + st.text + '”' : c ? c.label : ''; }
function renderGrid(items, total, local, empty) {
  setTitle(); $('#grid-count').textContent = total ? total.toLocaleString('pt-BR') + ' títulos' : '';
  if (!items.length) { gridEl.replaceChildren(el('p', 'msg', local ? 'Toque no + de um filme para guardá-lo aqui.' : 'Nenhum filme encontrado. Tente outra busca.')); moreBtn.hidden = true; return; }
  gridEl.replaceChildren(...items.map(createCard));
  moreBtn.hidden = local || empty || items.length >= total; moreBtn.disabled = false; moreBtn.textContent = 'Carregar mais';
}
moreBtn.onclick = () => { st.page++; loadGrid(false); };

/* ---------- search ---------- */
function toggleSearch(open) {
  searchBox.classList.toggle('open', open); topbar.classList.toggle('searching', open);
  if (open) searchEl.focus(); else searchEl.value = '';
}
let deb;
const runSearch = () => { const t = searchEl.value.trim(); if (t) show('search', { text: t }); else if (st.view === 'search') show('home'); };
searchEl.addEventListener('input', () => { clearTimeout(deb); deb = setTimeout(runSearch, 400); });
searchEl.addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(deb); runSearch(); } if (e.key === 'Escape') { toggleSearch(false); runSearch(); } });
searchEl.addEventListener('blur', () => setTimeout(() => { if (!searchEl.value.trim() && document.activeElement !== searchEl) { toggleSearch(false); if (st.view === 'search') show('home'); } }, 150));
$('#search-btn').onclick = () => searchBox.classList.contains('open') ? searchEl.focus() : toggleSearch(true);
$('#brand').onclick = e => { e.preventDefault(); go('home'); };
addEventListener('scroll', () => topbar.classList.toggle('solid', scrollY > 20), { passive: true });
/* ---------- list & player ---------- */
const modal = $('#modal'); let active = null;
function toggleSaved(it) {
  const had = isSaved(it);
  saved = had ? saved.filter(x => x.identifier !== it.identifier) : [...saved, slim(it)];
  store.set('spritz-list', saved);
  document.querySelectorAll('.round').forEach(paintSave); renderRowList(); paintBillList(); paintModalSave();
  if (st.view === 'list') renderGrid(saved, saved.length, true);
  toast(had ? 'Removido da sua lista' : 'Salvo na sua lista');
}
function paintModalSave() { if (!active) return; const on = isSaved(active); $('#m-save').replaceChildren(icon(on ? 'check' : 'plus'), el('span', '', on ? 'Na minha lista' : 'Minha lista')); }
function openPlayer(it) {
  active = it; $('#m-title').textContent = titleOf(it);
  $('#m-tags').replaceChildren(...[it.year, license(it.licenseurl), ...genres(it)].filter(Boolean).map(t => el('span', '', t)));
  $('#m-desc').textContent = clean(it.description).slice(0, 600) || 'Filme disponível no acervo aberto do Internet Archive.';
  $('#m-link').href = 'https://archive.org/details/' + encodeURIComponent(it.identifier);
  const f = document.createElement('iframe'); f.src = 'https://archive.org/embed/' + encodeURIComponent(it.identifier) + '?autoplay=1'; f.title = 'Player de ' + titleOf(it); f.allow = 'autoplay; fullscreen'; f.allowFullscreen = true;
  $('#player').replaceChildren(f); paintModalSave();
  modal.classList.add('open'); modal.setAttribute('aria-hidden', 'false'); document.body.style.overflow = 'hidden';
}
function closePlayer() { modal.classList.remove('open'); modal.setAttribute('aria-hidden', 'true'); $('#player').replaceChildren(); document.body.style.overflow = ''; active = null; }
$('#m-close').onclick = closePlayer; $('.modal-bd').onclick = closePlayer; $('#m-save').onclick = () => active && toggleSaved(active);
addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('open')) closePlayer(); });
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1800); }

hydrate(); buildNav(); buildHome(); show('home');
})();
</script>
</body>
